services:
  postgres:
    image: postgres:15
    container_name: basketball-postgres
    environment:
      POSTGRES_DB: basketball
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5433:5432"
    volumes:
      - basketball-postgres-data:/var/lib/postgresql/data

volumes:
  basketball-postgres-data:
